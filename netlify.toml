# Deploy no Netlify: conectar o repositório e usar estas configurações (já vêm daqui).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# O service worker nunca pode ficar preso em cache, senão o app não atualiza.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Binários de execução (onnxruntime e fonemizador): não têm hash no nome.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Observação: não ativamos COOP/COEP. Eles liberariam várias threads no ONNX, mas bloqueiam recursos
# de outras origens e exigem testes extras; hoje o app roda com 1 thread (ver CLAUDE.md).
